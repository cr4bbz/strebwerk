[package]
name = "strebwerk"
version = "0.1.0"
edition = "2021"
authors = ["Julian L. Voigt"]
description = "Interaktive 3D-Umgebung für exakte mathematische Konstruktionen mit Verstrebungen"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
glam = { version = "0.29", features = ["serde"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
opt-level = 3
